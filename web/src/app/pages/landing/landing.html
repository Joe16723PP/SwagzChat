<mat-card class="panel" appearance="outlined">
  <mat-card-header>
    <mat-card-title>SwagzChat</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p class="lede">Enter your name to open chat.</p>
    <form (submit)="enter($event)">
      <mat-form-field appearance="outline" class="full">
        <mat-label>Name</mat-label>
        <input
          matInput
          id="guest-name"
          type="text"
          maxlength="32"
          autocomplete="nickname"
          [value]="name()"
          (input)="onName($event)"
        />
        @if (errorMessage()) {
          <p class="error" role="alert">{{ errorMessage() }}</p>
        }
      </mat-form-field>
      <button matButton="filled" type="submit">Continue</button>
    </form>
  </mat-card-content>
</mat-card>
